appId: com.ndcli.cvatboxcounter
productName: CVAT Box Counter & Duplicate Inspector
asar: true
toolsets:
  winCodeSign: "1.1.0"
directories:
  output: release/windows
files:
  - dist-desktop/**/*
  - desktop/main.cjs
  - desktop/preload.cjs
  - desktop/generated/default-token.cjs
  - desktop/generated/default-tokens.cjs
  - desktop/assets/**/*
win:
  icon: desktop/assets/app-icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: CVAT-Box-Counter-Setup-${version}-win-${arch}.${ext}
portable:
  artifactName: CVAT-Box-Counter-${version}-portable-win-${arch}.${ext}
appx:
  identityName: cvattools.CVATTools
  publisher: CN=63147F28-03C4-435D-B5F4-AAD25100D8FD
  applicationId: CVATBoxCounter
  displayName: CVAT Tools
  publisherDisplayName: cvattools
  capabilities:
    - privateNetworkClientServer
  artifactName: CVAT-Box-Counter-Store-${version}-win-${arch}.${ext}
