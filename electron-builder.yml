appId: com.ndcli.cvatboxcounter
productName: CVAT Box Counter & Duplicate Inspector
asar: true
toolsets:
  winCodeSign: "1.1.0"
directories:
  output: release/windows
files:
  - dist-desktop/**/*
  - desktop/main.cjs
  - desktop/preload.cjs
  - desktop/generated/default-token.cjs
  - desktop/assets/**/*
win:
  icon: desktop/assets/app-icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: CVAT-Box-Counter-Setup-${version}-win-${arch}.${ext}
portable:
  artifactName: CVAT-Box-Counter-${version}-portable-win-${arch}.${ext}
appx:
  identityName: Hoakim.CVATBoxAudit
  publisher: CN=06970FBF-6DEA-4FD9-BB5E-DCC0D8D933EB
  applicationId: CVATBoxCounter
  displayName: CVAT Box Counter & Duplicate Inspector
  publisherDisplayName: Hoakim
  capabilities:
    - privateNetworkClientServer
  artifactName: CVAT-Box-Counter-Store-${version}-win-${arch}.${ext}
