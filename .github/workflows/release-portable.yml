name: Release portable patch

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run desktop:build
      - run: node desktop/prepare-default-token.cjs
      - run: node desktop/prepare-default-tokens.cjs
      - name: Build portable package with retries
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            npx electron-builder --win portable --x64 --publish never
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -eq 5) { exit $LASTEXITCODE }
            $delay = 10 * $attempt
            Write-Host "Portable build failed; retrying in $delay seconds (attempt $($attempt + 1)/5)."
            Start-Sleep -Seconds $delay
          }
      - name: Create checksum
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $file = "release/windows/CVAT-Tools-$version-portable-win-x64.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $file -Leaf)" | Set-Content "$file.sha256" -NoNewline
          $legacyFile = "release/windows/CVAT-Box-Counter-$version-portable-win-x64.exe"
          Copy-Item $file $legacyFile
          $legacyHash = (Get-FileHash $legacyFile -Algorithm SHA256).Hash.ToLower()
          "$legacyHash  $(Split-Path $legacyFile -Leaf)" | Set-Content "$legacyFile.sha256" -NoNewline
          $zip = "release/windows/CVAT-Tools-$version-win-x64.zip"
          Copy-Item "release/windows/win-unpacked/CVAT Tools.exe" "release/windows/win-unpacked/CVAT Box Counter & Duplicate Inspector.exe"
          Compress-Archive -Path release/windows/win-unpacked/* -DestinationPath $zip
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$zipHash  $(Split-Path $zip -Leaf)" | Set-Content "$zip.sha256" -NoNewline
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/windows/CVAT-Box-Counter-*-portable-win-x64.exe
            release/windows/CVAT-Box-Counter-*-portable-win-x64.exe.sha256
            release/windows/CVAT-Tools-*-portable-win-x64.exe
            release/windows/CVAT-Tools-*-portable-win-x64.exe.sha256
            release/windows/CVAT-Tools-*-win-x64.zip
            release/windows/CVAT-Tools-*-win-x64.zip.sha256
